name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, node: '22' }
          - { os: macos-15, node: '24' }
          - { os: macos-15, node: '26' }
          - { os: macos-15-intel, node: '24' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Build and verify standalone bundle without system Node or compiler
        if: matrix.node == '24'
        run: |
          npm run build:standalone
          npm run check:standalone
  ci:
    name: CI
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform check
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
